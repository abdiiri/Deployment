<!DOCTYPE html>
<html>
<head>
  <title>ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>🛍️ ShopEasy</nav>

  <header>
    <h1>Shop the Best Deals</h1>
    <p>Quality products at great prices</p>
  </header>

  <h2>Our Products</h2>

  <div class="products">

    <div class="card">
      <div class="icon">👟</div>
      <h3>Sneakers</h3>
      <p class="price">KSh 3,500</p>
      <input type="checkbox" id="p1">
      <label for="p1"></label>
    </div>

    <div class="card">
      <div class="icon">🎧</div>
      <h3>Headphones</h3>
      <p class="price">KSh 2,800</p>
      <input type="checkbox" id="p2">
      <label for="p2"></label>
    </div>

    <div class="card">
      <div class="icon">⌚</div>
      <h3>Smart Watch</h3>
      <p class="price">KSh 4,200</p>
      <input type="checkbox" id="p3">
      <label for="p3"></label>
    </div>

  </div>

  <div class="checkout">
    <h2>Checkout</h2>
    <p class="count">Items in cart: </p>
    <input type="text" placeholder="Full name">
    <input type="text" placeholder="Phone number">
    <input type="text" placeholder="Delivery address">
    <button>Place Order</button>
  </div>

  <footer>© 2026 ShopEasy</footer>

</body>
</html>
